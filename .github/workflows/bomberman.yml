name: generate arcade contribution graphs

on:
  schedule: # Se ejecuta automáticamente todos los días
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate bomberman contribution graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'bomberman'
          hide_month_labels: 'false'

      # Sube la animación generada a una rama llamada 'output'
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
